---
- name: Query AAP Controller Job Template
  hosts: tigbit
  gather_facts: false

  collections:
    - infra.controller_configuration

  tasks:
    - name: Query the job_templates endpoint
      ansible.builtin.set_fact: 
        api_response: >-
                {{ 
                  query(
                    'ansible.controller.controller_api',
                    'job_templates',
                    host=controller_hostname,
                    oauth_token=controller_oauthtoken,
                    verify_ssl=false,
                    return_all=true,
                    query_params={ 'name__startswith' : 'jt test', },
                  ) | map(attribute='name') | list 
                }}

    - name: Display Job Template ID and Info
      ansible.builtin.debug:
        msg: '{{ api_response }}'


