---
#
# Usage:
# ansible-playbook tigbit.aap_config.apply_config.yml --tags "job_templates" -e "filetree_controller_include='jt_flap.yml'"#
#
- name: Update an object using Configuration as Code
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    aap_hostname: 'https://{{ controller_hostname }}'
    aap_token: '{{ controller_oauthtoken }}'
    aap_validate_certs: false

    # The base directory remains fixed
    dir_orgs_vars: "~/aap/git/tigbit_inventory/data/aap_config/"

    #controller_templates: "jt flap"

    controller_configuration_filetree_read_layout: "create"

  tasks:
    - name: Read the specific Job Template from the file tree
      ansible.builtin.include_role:
        name: infra.aap_configuration_extended.filetree_read
      tags:
        - always

    - name: Dispatch the single Job Template configuration to AAP
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      tags:
        - always
