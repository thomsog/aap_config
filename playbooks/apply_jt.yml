---
- name: Apply Controller Job Templates Configuration
  hosts: tigbit
  connection: local
  gather_facts: false

  vars:
    # AAP Connection parameters
    aap_hostname: '{{ controller_hostname }}'
    aap_token: '{{ controller_oauthtoken }}'
    aap_validate_certs: false
    
    # Toggle to dynamically provision missing labels found in your templates list
    aap_configuration_autocreate_labels: true

  tasks:
    - name: Include the AAP Configuration variables
      ansible.builtin.include_vars:
        file: ~/aap/config/job_templates.yml

    - name: Create or Update Job Templates in Controller
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_job_templates
      when: controller_templates is defined

