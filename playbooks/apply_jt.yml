---
- name: Update a single Job Template using Configuration as Code
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    aap_hostname: 'https://{{ controller_hostname }}'
    aap_token: '{{ controller_oauthtoken }}'
    aap_validate_certs: false

    # The base directory remains fixed
    dir_orgs_vars: "~/aap/config/"

    controller_configuration_filetree_read_layout: "create"

    # Inject the runtime variable 'target_template' into the filetree path
    filetree_controller_job_templates_dirs:
      - "{{ filetree_read_base_dir }}/controller_job_templates.d/{{ target_template }}.yml"

  tasks:
    - name: Read the specific Job Template from the file tree
      ansible.builtin.include_role:
        name: infra.aap_configuration_extended.filetree_read
      tags:
        - job_templates

    - name: Dispatch the single Job Template configuration to AAP
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      tags:
        - job_templates
