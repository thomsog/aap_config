---

#
# Usage:
# ansible-playbook tigbit.aap_config.get_config.yml -e '{"input_tag": ["controller_job_templates"], "job_template_name": "jt flap"}'
#

- hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: 'https://{{ controller_hostname }}'
    aap_token: '{{ controller_oauthtoken }}'
    aap_validate_certs: false

    output_path: "~/aap/git/tigbit_inventory/data/aap_config/"
    omit_id: true
    env_fields_as_variables: false
    export_related_objects: false
    secrets_as_variables: true

    # Options to handle the variables stub file
    #
    # Don't generate the file
    #generate_env_variables_stub: false
    #
    # Generate the file in a different location
    env_variables_stub_path: /tmp/env_variables_stub.yml

    inventory_name: "tigbit"
    organization_filter: "tigbit"
    input_tag: 
      - all
      #- controller_workflow_job_templates
      #- controller_job_templates
      #- controller_schedules

  roles:
    - infra.aap_configuration_extended.filetree_create
